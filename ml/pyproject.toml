[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raahein-ml"
version = "0.1.0"
description = "Reproducible monument-recognition pipeline for Raahein"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faiss-cpu==1.9.0.post1",
  "httpx==0.28.1",
  "numpy==2.1.3",
  "ortools==9.15.6755",
  "Pillow==11.0.0",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
gpu = [
  "torch==2.5.1",
  "transformers==4.46.3",
]
test = [
  "pytest==8.3.4",
  "ruff==0.8.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "real_model: opt-in test that downloads checkpoints and requires configured hardware",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
