name: CI

on:
  push:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Frontend: runs once frontend/pnpm-lock.yaml exists
      - uses: pnpm/action-setup@v4
        if: ${{ hashFiles('frontend/pnpm-lock.yaml') != '' }}
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        if: ${{ hashFiles('frontend/pnpm-lock.yaml') != '' }}
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend typecheck, lint, unit tests, build
        if: ${{ hashFiles('frontend/pnpm-lock.yaml') != '' }}
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run lint
          pnpm run test:unit
          pnpm run build

      - name: Install Playwright browser
        if: ${{ hashFiles('frontend/pnpm-lock.yaml') != '' }}
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Frontend end-to-end tests
        if: ${{ hashFiles('frontend/pnpm-lock.yaml') != '' }}
        working-directory: frontend
        run: pnpm run test:e2e

      # Backend: runs once backend/requirements.txt exists
      - uses: actions/setup-python@v5
        if: ${{ hashFiles('backend/requirements.txt') != '' }}
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend lint and tests
        if: ${{ hashFiles('backend/requirements.txt') != '' }}
        working-directory: backend
        run: |
          pip install -r requirements.txt ruff pytest
          ruff check .
          pytest -q || [ $? -eq 5 ]   # 5 = no tests yet

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements-ci.txt

      - name: Install ML test dependencies
        working-directory: ml
        run: |
          pip install -r requirements-ci.txt
          pip install --no-deps -e .

      - name: Reject tracked raw images and binary artifacts
        run: |
          if git ls-files | grep -E -i '\.(jpe?g|jfif|png|webp|faiss|npy|npz|pt|pth|safetensors)$'; then
            echo 'Raw images and generated ML artifacts must not be tracked.' >&2
            exit 1
          fi

      - name: ML lint and fast tests
        working-directory: ml
        run: |
          ruff check src tests
          pytest -q -m 'not real_model'
